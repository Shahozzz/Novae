<style>
  :root {
    /* ===== NOVAE SYSTEMS — IDENTITÉ VERTE ===== */
    --primary: #25D366;
    --primary-light: #39FF88;
    --primary-dark: #128C55;

    --text: #F1F7F3;
    --text-light: #91A99B;

    --bg: #06130E;
    --bg-alt: #081A12;
    --card: #0B2118;

    --border: rgba(37, 211, 102, 0.18);
    --border-hover: rgba(57, 255, 136, 0.45);

    --glow: rgba(37, 211, 102, 0.16);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
    scroll-padding-top: 90px;
  }

  body {
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Helvetica,
      Arial,
      sans-serif;

    line-height: 1.6;
    color: var(--text);

    background:
      radial-gradient(
        circle at 15% 10%,
        rgba(37, 211, 102, 0.07),
        transparent 28%
      ),
      radial-gradient(
        circle at 85% 45%,
        rgba(57, 255, 136, 0.035),
        transparent 30%
      ),
      var(--bg);

    min-height: 100vh;
  }

  a {
    color: inherit;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px;
  }


  /* =========================
     HEADER
  ========================= */

  header {
    position: sticky;
    top: 0;
    z-index: 100;

    background: rgba(6, 19, 14, 0.90);

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    border-bottom: 1px solid var(--border);
  }

  .header-content {
    min-height: 76px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
    flex-wrap: wrap;
  }

  .logo {
    color: var(--text);
    text-decoration: none;

    font-size: 1.45rem;
    font-weight: 800;

    letter-spacing: -0.03em;
  }

  .logo span {
    color: var(--primary);
  }

  .nav-links {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .nav-links a {
    color: var(--text-light);
    text-decoration: none;

    font-size: 0.9rem;
    font-weight: 600;

    transition: color 0.2s ease;
  }

  .nav-links a:hover {
    color: var(--primary-light);
  }


  /* =========================
     BOUTONS
  ========================= */

  .cta-button,
  .secondary-button {
    display: inline-block;

    padding: 11px 20px;

    border-radius: 8px;

    text-decoration: none;

    font-weight: 700;

    transition:
      background 0.2s ease,
      color 0.2s ease,
      border-color 0.2s ease,
      box-shadow 0.2s ease,
      transform 0.2s ease;
  }

  .cta-button {
    background: var(--primary);
    color: #04100A;

    box-shadow:
      0 0 18px rgba(37, 211, 102, 0.12);
  }

  .cta-button:hover {
    background: var(--primary-light);

    transform: translateY(-2px);

    box-shadow:
      0 0 18px rgba(57, 255, 136, 0.30),
      0 0 40px rgba(37, 211, 102, 0.12);
  }

  .secondary-button {
    background: transparent;

    color: var(--primary);

    border: 1px solid rgba(37, 211, 102, 0.45);
  }

  .secondary-button:hover {
    background: rgba(37, 211, 102, 0.07);

    color: var(--primary-light);

    border-color: var(--primary-light);

    box-shadow:
      0 0 22px rgba(37, 211, 102, 0.10);
  }


  /* =========================
     HERO
  ========================= */

  .hero {
    position: relative;

    padding: 85px 0;

    background:
      radial-gradient(
        circle at 50% 0%,
        rgba(37, 211, 102, 0.10),
        transparent 45%
      );

    text-align: center;

    overflow: hidden;
  }

  .hero::after {
    content: "";

    position: absolute;

    width: 500px;
    height: 500px;

    left: 50%;
    top: -350px;

    transform: translateX(-50%);

    background:
      radial-gradient(
        circle,
        rgba(57, 255, 136, 0.08),
        transparent 70%
      );

    pointer-events: none;
  }

  .hero .container {
    position: relative;
    z-index: 1;
  }

  .hero h1 {
    max-width: 900px;

    margin: 0 auto 18px;

    color: var(--text);

    font-size: clamp(2.3rem, 5vw, 3.8rem);

    line-height: 1.08;

    letter-spacing: -0.045em;
  }

  .hero h1::first-line {
    color: var(--text);
  }

  .hero p {
    max-width: 720px;

    margin: 0 auto 28px;

    color: var(--text-light);

    font-size: 1.05rem;
  }

  .hero-buttons {
    display: flex;

    justify-content: center;

    gap: 12px;

    flex-wrap: wrap;
  }


  /* =========================
     SECTIONS
  ========================= */

  .section {
    padding: 70px 0;
  }

  .section-alt {
    background:
      linear-gradient(
        180deg,
        rgba(8, 26, 18, 0.96),
        rgba(6, 19, 14, 0.96)
      );
  }

  .section-title {
    text-align: center;

    color: var(--text);

    font-size: 2rem;

    margin-bottom: 14px;

    letter-spacing: -0.025em;
  }

  .section-subtitle {
    max-width: 720px;

    margin: 0 auto 40px;

    color: var(--text-light);

    text-align: center;
  }


  /* =========================
     CARTES
  ========================= */

  .services-grid {
    display: grid;

    grid-template-columns:
      repeat(auto-fit, minmax(290px, 1fr));

    gap: 22px;
  }

  .service-card {
    position: relative;

    padding: 25px;

    background:
      linear-gradient(
        145deg,
        rgba(11, 33, 24, 0.96),
        rgba(7, 25, 17, 0.96)
      );

    border: 1px solid var(--border);

    border-radius: 14px;

    transition:
      transform 0.25s ease,
      border-color 0.25s ease,
      box-shadow 0.25s ease;
  }

  .service-card:hover {
    transform: translateY(-4px);

    border-color: var(--border-hover);

    box-shadow:
      0 14px 35px rgba(0, 0, 0, 0.28),
      0 0 30px rgba(37, 211, 102, 0.07);
  }

  .service-card h3 {
    color: var(--text);

    font-size: 1.25rem;

    line-height: 1.3;

    margin-bottom: 12px;
  }

  .service-card p {
    color: var(--text-light);

    margin-bottom: 17px;
  }

  .service-card ul {
    margin: 0 0 18px 20px;

    color: var(--text-light);
  }

  .service-card li {
    margin-bottom: 6px;
  }

  .service-card li::marker {
    color: var(--primary);
  }


  /* =========================
     PRIX
  ========================= */

  .price {
    display: block;

    margin-bottom: 17px;

    color: var(--primary);

    font-size: 1.12rem;

    font-weight: 800;

    line-height: 1.45;
  }

  .price-badge {
    position: absolute;

    top: 15px;
    right: 15px;

    padding: 5px 11px;

    background: var(--primary);

    color: #04100A;

    border-radius: 999px;

    font-size: 0.75rem;

    font-weight: 800;
  }

  .price-badge.recommande {
    background: var(--primary-light);
  }


  /* =========================
     TEMOIGNAGES
  ========================= */

  .testimonials-grid {
    display: grid;

    grid-template-columns:
      repeat(auto-fit, minmax(280px, 1fr));

    gap: 22px;
  }

  .testimonial-card {
    padding: 22px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 14px;
  }

  .testimonial-card p {
    color: var(--text-light);

    font-style: italic;

    margin-bottom: 12px;
  }

  .testimonial-author {
    color: var(--text);

    font-weight: 700;
  }


  /* =========================
     POURQUOI MOI
  ========================= */

  .why-me-list {
    max-width: 720px;

    margin: 0 auto;
  }

  .why-me-list ul {
    list-style: none;
  }

  .why-me-list li {
    padding: 13px 0;

    color: var(--text-light);

    border-bottom:
      1px solid var(--border);
  }

  .why-me-list li:last-child {
    border-bottom: none;
  }

  .why-me-list strong {
    color: var(--text);
  }


  /* =========================
     CTA FINAL
  ========================= */

  .cta-final {
    position: relative;

    text-align: center;

    overflow: hidden;
  }

  .cta-final::before {
    content: "";

    position: absolute;

    width: 420px;
    height: 420px;

    left: 50%;
    bottom: -330px;

    transform: translateX(-50%);

    background:
      radial-gradient(
        circle,
        rgba(37, 211, 102, 0.10),
        transparent 70%
      );

    pointer-events: none;
  }

  .cta-final .container {
    position: relative;
    z-index: 1;
  }

  .cta-final h2 {
    color: var(--text);

    font-size: 1.8rem;

    margin-bottom: 12px;
  }

  .cta-final p {
    max-width: 650px;

    margin: 0 auto 24px;

    color: var(--text-light);
  }


  /* =========================
     FOOTER
  ========================= */

  footer {
    padding: 42px 0 25px;

    background: #040D09;

    border-top:
      1px solid var(--border);
  }

  .footer-grid {
    display: grid;

    grid-template-columns:
      repeat(auto-fit, minmax(220px, 1fr));

    gap: 30px;
  }

  .footer-col h4 {
    color: var(--text);

    font-size: 1.05rem;

    margin-bottom: 12px;
  }

  .footer-col p,
  .footer-col a {
    display: block;

    color: var(--text-light);

    text-decoration: none;

    margin-bottom: 7px;
  }

  .footer-col a:hover {
    color: var(--primary);
  }

  .copyright {
    text-align: center;

    margin-top: 30px;
    padding-top: 20px;

    border-top:
      1px solid rgba(37, 211, 102, 0.10);

    color: #63796C;

    font-size: 0.82rem;
  }


  /* =========================
     MOBILE
  ========================= */

  @media (max-width: 768px) {

    .header-content {
      flex-direction: column;

      align-items: center;

      padding: 14px 0;
    }

    .nav-links {
      justify-content: center;

      gap: 10px 15px;
    }

    .nav-links a {
      font-size: 0.82rem;
    }

    .header-content > .cta-button {
      width: 100%;

      text-align: center;
    }

    .hero {
      padding: 65px 0;
    }

    .hero h1 {
      font-size: 2rem;
    }

    .hero p {
      font-size: 0.98rem;
    }

    .hero-buttons {
      flex-direction: column;
    }

    .hero-buttons a {
      width: 100%;

      text-align: center;
    }

    .section {
      padding: 55px 0;
    }

    .section-title {
      font-size: 1.65rem;
    }

    .services-grid {
      grid-template-columns: 1fr;
    }

    .service-card {
      padding: 22px;
    }

    .price-badge {
      font-size: 0.68rem;
    }
  }


  /* =========================
     ACCESSIBILITÉ
  ========================= */

  @media (prefers-reduced-motion: reduce) {

    html {
      scroll-behavior: auto;
    }

    *,
    *::before,
    *::after {
      transition: none !important;
    }
  }

</style>
